name: Publish Ark Agent
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_brief:
        description: '重新擷取今日盤勢（僅交易日）'
        type: boolean
        default: false
  schedule:
    - cron: '52 7 * * 1-5'
      timezone: 'Asia/Taipei'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ark-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify data and stream contracts
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.js
      - name: Update public daily brief on trading days
        if: github.event_name == 'schedule' || inputs.refresh_brief == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
        run: python scripts/publish_brief.py
      - name: Preserve published daily history
        if: github.event_name == 'schedule' || inputs.refresh_brief == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/briefs
          if ! git diff --cached --quiet; then
            git commit -m 'Update public daily brief'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build public static assets only
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
